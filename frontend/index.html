<!DOCTYPE html>
<html>
<head>
<title>AI Gene Biomarker Discovery</title>

<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

<style>

body{
font-family: Arial, sans-serif;
background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
color:white;
margin:0;
padding:0;
}

header{
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
background:#111;
}

.container{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
padding:20px;
}

.card{
background:#1e293b;
border-radius:10px;
padding:20px;
box-shadow:0 0 10px rgba(0,0,0,0.3);
}

button{
padding:12px 20px;
border:none;
background:#3b82f6;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2563eb;
}

#plot{
height:450px;
}

#aiOutput{
white-space:pre-wrap;
background:#0f172a;
padding:15px;
border-radius:6px;
height:350px;
overflow-y:auto;
overflow-x:hidden;
line-height:1.6;
font-size:15px;
}

table{
width:100%;
border-collapse:collapse;
}

td,th{
border-bottom:1px solid #444;
padding:8px;
}

.loading{
display:none;
font-size:18px;
}

</style>
</head>

<body>

<header>AI Gene Biomarker Discovery Platform</header>

<div class="container">

<div class="card">
<h3>Upload Dataset</h3>

<input type="file" id="fileInput">

<br><br>

<button onclick="runAnalysis()">Run Analysis</button>

<p class="loading" id="loading">Running analysis...</p>

</div>

<div class="card">
<h3>AI Interpretation</h3>

<div id="aiOutput">AI output will appear here.</div>

</div>

<div class="card">
<h3>Volcano Plot</h3>

<div id="plot"></div>

</div>

<div class="card">

<h3>Top Genes</h3>

<table id="geneTable">

<thead>
<tr>
<th>Gene</th>
<th>logFC</th>
<th>P Value</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</div>

<script>

async function runAnalysis(){

const loading=document.getElementById("loading")
const fileInput=document.getElementById("fileInput")
const aiBox=document.getElementById("aiOutput")

if(fileInput.files.length===0){
alert("Please upload a dataset")
return
}

loading.style.display="block"
aiBox.innerText="Running AI analysis..."

const file=fileInput.files[0]

let formData=new FormData()
formData.append("file",file)

try{

const response=await fetch("http://localhost:8000/upload",{
method:"POST",
body:formData
})

const result=await response.json()

console.log("Backend response:",result)

loading.style.display="none"

/* Volcano Plot */

const plotData=JSON.parse(result.plot)

Plotly.newPlot(
"plot",
plotData.data,
plotData.layout
)

/* Gene Table */

displayGenes(result.genes)

/* AI Interpretation */

displayAI(result.ai)

}
catch(error){

loading.style.display="none"
console.error(error)

aiBox.innerText="Error running analysis"

}

}

function displayGenes(genes){

let table=document.querySelector("#geneTable tbody")
table.innerHTML=""

genes.forEach(g=>{

let row=document.createElement("tr")

row.innerHTML=`
<td>${g.gene_id}</td>
<td>${Number(g.logFC).toFixed(3)}</td>
<td>${Number(g["P.Value"]).toExponential(2)}</td>
`

table.appendChild(row)

})

}

function displayAI(text){

const aiBox=document.getElementById("aiOutput")

if(!text){
aiBox.innerText="No AI interpretation returned"
return
}

aiBox.innerText=text

}

</script>

</body>
</html>
